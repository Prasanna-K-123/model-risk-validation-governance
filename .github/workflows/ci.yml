name: Independent Model Validation Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest
      - name: Run independent validation
        run: python run_validation.py
      - name: Persist reproducible evidence
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs reports/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: persist validated model-risk evidence"
            git push
          fi
